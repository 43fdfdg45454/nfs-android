[package]
name = "nfs-ffi"
version = "1.0.0"
description = "The app's bridge to nfs-core: UniFFI bindings over its client and file engine"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
name = "nfscore"
crate-type = ["cdylib", "lib"]

# nfs-core at a fixed commit: move it forward on purpose, after its CI is green.
[dependencies]
nfs-client = { git = "https://github.com/43fdfdg45454/nfs-core", rev = "e2f0be67b03e96d1ed9752a2c230358271ee258a" }
nfs-engine = { git = "https://github.com/43fdfdg45454/nfs-core", rev = "e2f0be67b03e96d1ed9752a2c230358271ee258a" }
nfs-rpc = { git = "https://github.com/43fdfdg45454/nfs-core", rev = "e2f0be67b03e96d1ed9752a2c230358271ee258a" }
nfs-tunnel = { git = "https://github.com/43fdfdg45454/nfs-core", rev = "e2f0be67b03e96d1ed9752a2c230358271ee258a" }
# TLS 1.3 only, as nfs-core: no TLS 1.2 code in the app.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio = { version = "1", features = ["full"] }
uniffi = { version = "0.32", features = ["tokio", "cli"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

# The phone's library: smaller and faster.
[profile.android]
inherits = "release"
lto = true
codegen-units = 1
strip = true
