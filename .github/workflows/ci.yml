name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Only reading, unless a job asks for more.
permissions:
  contents: read

jobs:
  privacy:
    name: Privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: No addresses or host names of a real network
        run: |
          range="${{ github.event.before }}..${{ github.sha }}"
          git cat-file -e "${{ github.event.before }}" 2>/dev/null || range="${{ github.sha }}"
          ci/run.sh Privacy ci/privacy.sh "$range"
      - name: Every emulator test in one group
        run: ci/run.sh Groups ci/shards.sh

  # The client core (rust/), each part on its own runner at once: libnfscore.so for the emulator
  # (x86_64) and the Kotlin bindings (with fmt, clippy and unit tests) are what the emulator and
  # CodeQL wait for; the phone's (arm64-v8a, core-arm) only the release build does.
  core:
    name: Core ${{ matrix.part }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        part: [x86_64, bindings]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: x86_64-linux-android
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          key: ${{ matrix.part }}
      - name: cargo-ndk
        if: matrix.part != 'bindings'
        run: cargo install cargo-ndk --locked
      - name: Format, lints and unit tests
        if: matrix.part == 'bindings'
        working-directory: rust
        run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked --lib
      - name: Library or bindings
        env:
          PART: ${{ matrix.part }}
        run: ci/run.sh "Core" ci/core.sh "$PART"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-${{ matrix.part }}
          path: core/src/main

  core-arm:
    name: Core arm64-v8a
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          key: arm64-v8a
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Library
        run: ci/run.sh "Core" ci/core.sh arm64-v8a
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-arm64-v8a
          path: core/src/main

  # The version from the history (GitVersion.yml): the APK's name and code, and the release's tag.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: version
        run: ci/version.sh

  build:
    name: Build
    needs: [core, core-arm, version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: core-*
          merge-multiple: true
          path: core/src/main
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.NFS_KEYSTORE_BASE64 }}
        run: if [ -n "$KEYSTORE" ]; then echo "$KEYSTORE" | base64 -d > release.jks; fi
      - name: Debug and release
        env:
          NFS_KEYSTORE_PASSWORD: ${{ secrets.NFS_KEYSTORE_PASSWORD }}
          NFS_VERSION: ${{ needs.version.outputs.name }}
          NFS_VERSION_CODE: ${{ needs.version.outputs.code }}
        run: |
          ci/run.sh "Build" ./gradlew --no-daemon assembleDebug assembleRelease
          mkdir -p apk && cp app/build/outputs/apk/release/app-release.apk "apk/NFS-$NFS_VERSION.apk"
          echo "::notice title=APK::NFS-$NFS_VERSION.apk ($(du -h apk/*.apk | cut -f1))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NFS-apk
          path: apk/*.apk

  # Static analysis of the Kotlin code (security-extended): CodeQL sees it compiled, so it needs
  # the core's library and a compilation without the build cache.
  codeql-kotlin:
    name: CodeQL Kotlin
    needs: core
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: core-*
          merge-multiple: true
          path: core/src/main
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      - name: Compile
        run: ci/run.sh "CodeQL compile" ./gradlew --no-daemon --no-build-cache --rerun-tasks :app:compileReleaseKotlin
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4

  # The provider as other apps use it, on emulators against nfsd on each runner: the test classes
  # in groups at once (ci/shards.txt), the APKs built while the server and the emulator start.
  emulator:
    name: Emulator ${{ matrix.group }}
    needs: core
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group: [scenarios, uploads, modes, links]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: 43fdfdg45454/nfs-core
          path: nfs-core
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: core-*
          merge-multiple: true
          path: core/src/main
      - name: The APKs, built in the background
        run: nohup bash -c './gradlew --no-daemon --quiet assembleDebug assembleDebugAndroidTest > apks.log 2>&1; echo $? > apks.done' > /dev/null 2>&1 &
      - name: nfsd and the fixtures
        working-directory: nfs-core
        run: ci/run.sh "nfsd" bash -c "ci/certs.sh > /dev/null 2>&1 && ci/nfsd.sh && ci/fixtures.sh /srv/nfs/fixtures 256"
      - name: Symbolic links and trees for the provider's tests
        run: ci/run.sh "Links" ci/links.sh
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      # The emulator starts from a saved snapshot instead of a cold boot: made once and cached.
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: avd
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64
      - name: Snapshot of a booted emulator
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "snapshot saved"
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          GROUP: ${{ matrix.group }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ci/run.sh "Provider test" ci/emulator.sh "$GROUP"

  # A GitHub release for each push to master that passed everything: the signed APK, and the
  # commits since the previous release as its notes.
  release:
    name: Release
    needs: [privacy, version, build, emulator]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: NFS-apk
          path: apk
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.name }}
          SIGNED: ${{ secrets.NFS_KEYSTORE_BASE64 != '' }}
        run: ci/run.sh "Release" ci/release.sh "$VERSION" apk/*.apk
