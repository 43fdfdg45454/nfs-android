name: Security

# Beyond the tests: the bridge's dependencies with known vulnerabilities or foreign licenses or
# sources, secrets in the history, the workflows themselves, and static analysis (Rust, Actions;
# Kotlin in ci.yml). Android lint's security checks fail the release build (app/build.gradle.kts). Daily
# too: advisories appear without the code changing.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-deny
      - name: Advisories, licenses, sources and bans (rust/deny.toml)
        working-directory: rust
        run: ../ci/run.sh "Supply chain" cargo deny --locked check

  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: ci/secrets.sh

  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: zizmor (template injection, credentials, permissions, pinning, caches)
        run: |
          pip install --quiet zizmor==1.30.1
          zizmor --offline --format github .github/workflows

  codeql:
    name: CodeQL ${{ matrix.language }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Kotlin is analysed in ci.yml (job CodeQL Kotlin): it needs the core's library to build.
        language: [rust, actions]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
